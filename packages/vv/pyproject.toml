[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vv"
version = "0.1.0"
description = "Code-agnostic verification and validation runs: result records, plans and live progress."
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
vv = "vv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
