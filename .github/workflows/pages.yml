name: Deploy benchmark database page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A record replaced after it was published is read back from history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The site is the single standalone web/benchmarks.html page and the
      # data of the published runs (published.json): the newest run and the
      # one before. index_builder needs just these three and the shared vv
      # package. Nothing is simulated.
      - name: Install build deps
        run: pip install numpy pandas plotly ./packages/vv

      # benchmarks.html is the landing page (served as index.html at the root),
      # uses only relative paths, and inlines its own CSS. index_builder writes
      # the index and the exact published bytes of every record the detail
      # views lazy-load (records/<blob>.json).
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp web/benchmarks.html _site/index.html
          cp web/logo.png _site/logo.png
          cp -r web/models _site/models
          python -m yamc_verify.index_builder _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
