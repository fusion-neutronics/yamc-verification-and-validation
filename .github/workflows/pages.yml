name: Deploy benchmark database page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The site is the single standalone web/benchmarks.html page; the only
      # build step is generating the index JSON it reads. index_builder needs
      # just these three.
      - name: Install build deps
        run: pip install numpy pandas plotly

      # benchmarks.html is the landing page (served as index.html at the root),
      # uses only relative paths, and inlines its own CSS, so there is no MyST /
      # Node / BASE_URL involved: just copy the page and its assets, generate the
      # index, and drop in the results cache the detail views lazy-load.
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp web/benchmarks.html _site/index.html
          cp web/logo.png _site/logo.png
          cp -r web/models _site/models
          python -m yamc_verify.index_builder --out _site/benchmarks-index.json
          # detail views lazy-load per-benchmark cache JSON (~19 MB total)
          find tasks -path '*/cache/*' -name '*.json' -exec cp --parents -t _site {} +

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
