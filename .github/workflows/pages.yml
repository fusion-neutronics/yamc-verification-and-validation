name: Build and deploy Jupyter Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build deps
        run: pip install "jupyter-book>=2.0.0" numpy pandas plotly

      # no positional "." — jupyter-book >= 2.1 treats it as a file-export
      # target and builds nothing ("No file exports found").
      # BASE_URL: MyST emits root-absolute asset/link URLs; without the
      # project-page prefix everything 404s under github.io/<repo>/
      - name: Build site
        run: jupyter-book build --html
        env:
          BASE_URL: /${{ github.event.repository.name }}

      # NOT index.json: the MyST export owns _build/html/index.json (intro page data)
      - name: Build benchmark index
        run: python -m yamc_verify.index_builder --out _build/html/benchmarks-index.json

      - name: Add benchmark database page
        run: cp web/benchmarks.html _build/html/benchmarks.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
