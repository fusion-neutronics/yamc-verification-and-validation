version: 1
project:
  title: YAMC Verification
  # The per-family notebooks are now run-and-cache drivers only; the results are
  # presented by the interactive benchmark database page (web/benchmarks.html,
  # linked from the intro and shipped by the Pages CI), so they are no longer in
  # the book and are excluded from the build.
  toc:
    - file: intro.md
    - file: developer-notes.md
      title: Developer Notes
  error_rules:
    - myst-file-loads
  exclude:
    - .venv/**
    - _build/**
    - "**.ipynb_checkpoints"
    - verify.py
    - run_models.sh
    - LICENSE
    - README.md
    # run-and-cache driver notebooks, presented by the benchmark database page
    - tasks/**/*.ipynb
site:
  options:
    logo: logo.png
    favicon: logo.png
    navigation_depth: 5
    hide_authors: true
    style: style.css
