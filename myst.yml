version: 1
project:
  title: YAMC Verification
  # The per-family notebooks are gone: runs are driven directly by the
  # orchestrator (python -m yamc_verify.run_task), and results are presented by
  # the interactive benchmark database page (web/benchmarks.html, linked from the
  # intro and shipped by the Pages CI). The book is just the intro and dev notes.
  toc:
    - file: intro.md
    - file: developer-notes.md
      title: Developer Notes
  error_rules:
    - myst-file-loads
  exclude:
    - .venv/**
    - _build/**
    - "**.ipynb_checkpoints"
    - verify.py
    - run_models.sh
    - LICENSE
    - README.md
site:
  options:
    logo: logo.png
    favicon: logo.png
    navigation_depth: 5
    hide_authors: true
    style: style.css
