title: YAMC Verification
author: YAMC Team
logo: ""

exclude_patterns:
  - .venv
  - .venv/**
  - _build
  - "**.ipynb_checkpoints"
  - verify.py
  - LICENSE
  - README.md
  - .git
  - .gitignore
  - .claude

execute:
  execute_notebooks: auto
  timeout: 600

sphinx:
  config:
    html_theme_options:
      navigation_depth: 3
    suppress_warnings:
      - mystnb.unknown_mime_type

launch_buttons:
  notebook_interface: classic

repository:
  url: https://github.com/yamc/yamc-verification
  branch: main
